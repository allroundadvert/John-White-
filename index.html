      color: #f1f1f1;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0a2a66, #25d366);
      border-bottom: 5px solid #25d366;
    }

    header h1 {

      letter-spacing: 1px;
    }

    /* SLIDER */
    .slider {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .slides {
      display: flex;
      width: 200%;
      animation: slide 6s infinite;
    }

    .slides img {
      width: 50%;
      object-fit: cover;
    }

    @keyframes slide {
      0% { transform: translateX(0); }
      25% { transform: translateX(-50%); }
      50% { transform: translateX(-50%); }
      75% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      color: #25d366;
      margin-top: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* STATIC GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    footer {

      padding: 20px;
      background: #0a2a66;
      color: #f1f1f1;
      font-size: 14px;
      margin-top: 40px;
