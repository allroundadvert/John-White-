<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JOHN WHITE GLOBAL TELECOM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #0b0b0b;
  color: #f1f1f1;
  line-height: 1.6;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, #0a2a66, #25d366);
  border-bottom: 5px solid #25d366;
}

header h1 {
  font-size: 40px;
  margin-bottom: 10px;
  font-weight: bold;
}

header p {
  font-size: 20px;
  font-weight: bold;
  color: #ffffff;
}

.slider {
  width: 100%;
  max-width: 1200px;
  margin: 20px auto;
  overflow: hidden;
  border-radius: 10px;
}

.slides {
  display: flex;
  width: 400%;
  animation: slide 12s infinite;
}

.slides a {
  width: 25%;
}

.slides img {
  width: 100%;
  height: auto;
}

@keyframes slide {
  0% { transform: translateX(0); }
  25% { transform: translateX(-25%); }
  50% { transform: translateX(-50%); }
  75% { transform: translateX(-75%); }
  100% { transform: translateX(0); }
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

h2 {
  color: #25d366;
  margin-top: 30px;
  text-transform: uppercase;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  border-radius: 10px;
}

.request-form {
  background: #0f1f3d;
  padding: 25px;
  border-radius: 12px;
  margin-top: 25px;
}

.request-form label {
  font-weight: bold;
  color: #25d366;
}

.request-form input,
.request-form textarea,
.request-form select {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  margin-bottom: 18px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.submit-btn {
  width: 100%;
  padding: 16px;
  background: #25d366;
  color: #000;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.cta-buttons {
  text-align: center;
  margin: 40px 0;
}

.cta-buttons a {
  display: inline-block;
  margin: 10px;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  text-decoration: none;
}

.whatsapp-btn {
  background-color: #25d366;
  color: #000;
}

.call-btn {
  background-color: #0a2a66;
  color: #fff;
  border: 2px solid #25d366;
}

footer {
  text-align: center;
  padding: 20px;
  background: #0a2a66;
  color: #fff;
}
</style>
</head>

<body>

<header>
  <h1>JOHN WHITE GLOBAL TELECOM</h1>
  <p>Phones • Gadgets • Accessories • Quality You Can Trust</p>
</header>

<div class="container">

  <!-- SLIDER -->
  <div class="slider">
    <div class="slides">
      <a href="https://wa.me/2348037019193"><img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/2-16.jpg"></a>
      <a href="https://wa.me/2348037019193"><img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/JBL-Boombox-3-1.jpg"></a>
      <a href="https://wa.me/2348037019193"><img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/Screenshot_20250826-130552.jpg"></a>
      <a href="https://wa.me/2348037019193"><img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/Screenshot_20250826-130606.jpg"></a>
    </div>
  </div>

  <!-- PRODUCTS -->
  <h2>Our Products</h2>
  <div class="gallery">
    <img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/Screenshot_20260219-044337.jpg">
    <img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/Screenshot_20260219-044705.jpg">
    <img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/Screenshot_20260219-044804.jpg">
    <img src="https://raw.githubusercontent.com/allroundadvert/John-White-/a8c93f32fc16f49c275d953ef87b10e9f14fd4e9/IMG_20251008_145838_733.jpg">
  </div>

  <!-- REQUEST FORM -->
  <h2>Request a Gadget</h2>
  <div class="request-form">
    <form onsubmit="sendRequestToWhatsApp(); return false;">
      <div class="form-grid">
        <input id="productName" placeholder="Product Name" required>
        <input id="gadgetType" placeholder="Type of Gadget" required>
      </div>

      <textarea id="specifications" placeholder="Specifications" required></textarea>

      <div class="form-grid">
        <select id="condition">
          <option>Brand New</option>
          <option>UK Used</option>
          <option>Refurbished</option>
        </select>
        <input id="budget" placeholder="Budget Range" required>
      </div>

      <div class="form-grid">
        <input id="quantity" type="number" value="1" min="1">
        <input id="needDate" type="date" required>
      </div>

      <div class="form-grid">
        <input id="location" placeholder="Delivery Location" required>
        <select id="payment">
          <option>Pay on Delivery</option>
          <option>Bank Transfer</option>
          <option>Part Payment</option>
        </select>
      </div>

      <input id="customerPhone" placeholder="Your Phone Number" required>

      <button class="submit-btn">Send Request via WhatsApp</button>
    </form>
  </div>

  <!-- CTA -->
  <div class="cta-buttons">
    <a class="whatsapp-btn" href="https://wa.me/2348037019193">💬 WhatsApp</a>
    <a class="call-btn" href="tel:08037019193">📞 Call Now</a>
  </div>

</div>

<footer>
  © 2026 JOHN WHITE GLOBAL TELECOM
</footer>

<script>
function sendRequestToWhatsApp() {
  const msg =
    "NEW GADGET REQUEST%n%n" +
    "Product: " + productName.value + "%n" +
    "Type: " + gadgetType.value + "%n" +
    "Condition: " + condition.value + "%n" +
    "Budget: " + budget.value + "%n" +
    "Quantity: " + quantity.value + "%n" +
    "Needed By: " + needDate.value + "%n" +
    "Delivery Location: " + location.value + "%n" +
    "Payment: " + payment.value + "%n%n" +
    "Specs:%n" + specifications.value + "%n%n" +
    "Phone: " + customerPhone.value;

  window.open(
    "https://wa.me/2348037019193?text=" + encodeURIComponent(msg),
    "_blank"
  );
}
</script>

</body>
</html>
