.slider{

  margin:30px auto;

  border-radius:12px;

.slides{
  display:flex;
  animation:move 18s linear infinite;

  width:100%;
  max-width:380px;
  margin:0 15px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.7);
}

  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.5);
  transition:0.3s;
}
.gallery img:hover{
